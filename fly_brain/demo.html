<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fruit fly designs n8n workflows</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --fg:#e6e9ef; --dim:#7d8590; --accent:#ff6d5a; --ok:#3ddc84; --bad:#ff5d5d; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #app { display:grid; grid-template-columns: 1.15fr 1fr; height:100%; }
  #brain { position:relative; }
  canvas { display:block; width:100%; height:100%; }
  #caption { position:absolute; left:20px; bottom:16px; right:20px; color:var(--dim); font-size:13px; }
  #caption b { color:var(--fg); }
  #panel { background:var(--panel); padding:28px 32px; display:flex; flex-direction:column; gap:22px; border-left:1px solid #1e222c; }
  h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.2px; }
  h1 span { color:var(--dim); font-weight:400; }
  #brief { font-size:22px; min-height:60px; padding:14px 16px; border-left:3px solid var(--accent); background:#171b25; border-radius:0 8px 8px 0; }
  #brief small { display:block; color:var(--dim); font-size:12px; letter-spacing:.8px; text-transform:uppercase; margin-bottom:4px; }
  .votes { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .group h3 { margin:0 0 8px; font-size:12px; color:var(--dim); letter-spacing:.8px; text-transform:uppercase; }
  .bar { display:grid; grid-template-columns: 130px 1fr; align-items:center; gap:10px; margin:6px 0; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .bar .track { height:12px; background:#1c2130; border-radius:6px; overflow:hidden; }
  .bar .fill { height:100%; width:0; background:#4a5670; transition:width .25s ease; border-radius:6px; }
  .bar.win .fill { background:var(--accent); }
  .bar.win { color:#fff; }
  #workflow { display:flex; align-items:center; gap:12px; min-height:64px; }
  .node { padding:12px 16px; border-radius:10px; background:#1c2130; border:1px solid #2a3142; font-family:ui-monospace,Menlo,monospace; font-size:14px; opacity:.25; transition:opacity .3s; }
  .node.on { opacity:1; border-color:var(--accent); }
  .node small { display:block; color:var(--dim); font-size:11px; }
  .arrow { color:var(--dim); font-size:22px; }
  #n8n { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--dim); min-height:44px; word-break:break-all; }
  #editor { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:#ffb39a; min-height:20px; margin-top:6px; }
  #n8n.ok { color:var(--ok); } #n8n.bad { color:var(--bad); }
  #score { margin-top:auto; color:var(--dim); font-size:13px; }
  #score b { color:var(--fg); }
</style>
</head>
<body>
<div id="app">
  <div id="brain">
    <canvas id="c"></canvas>
    <div id="caption"></div>
  </div>
  <div id="panel">
    <h1>a fruit fly designs n8n workflows <span>(live)</span></h1>
    <div id="brief"><small>brief shown to the fly</small><span id="briefText">connecting…</span></div>
    <div class="votes">
      <div class="group"><h3>trigger node</h3><div id="trig"></div></div>
      <div class="group"><h3>action node</h3><div id="act"></div></div>
    </div>
    <div class="group"><h3>the fly's workflow</h3>
      <div id="workflow">
        <div class="node" id="nodeT">…<small>trigger</small></div>
        <div class="arrow">→</div>
        <div class="node" id="nodeA">…<small>action</small></div>
      </div>
    </div>
    <div class="group"><h3>n8n</h3><div id="n8n">waiting for a design…</div><div id="editor"></div></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
let P = [], glow = [], color = [], angle = 0, cfg = null;
let correct = 0, total = 0;
const BRIEF_COLORS = ['#ff6d5a','#5ac8ff','#c58cff','#ffd35a'];

function resize() { canvas.width = canvas.clientWidth * devicePixelRatio; canvas.height = canvas.clientHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

function bars(el, names, probs, winner) {
  const mx = probs ? Math.max(...probs) : 1;                       // normalize: leader = full bar
  el.innerHTML = names.map((n, i) => `
    <div class="bar ${winner === i ? 'win' : ''}"><span>${n}</span>
      <div class="track"><div class="fill" style="width:${Math.round((probs ? probs[i] / mx : 0) * 100)}%"></div></div></div>`).join('');
}

function draw() {
  const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, s = Math.min(w, h) * 0.62;
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, w, h);
  angle += 0.004;
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const pts = [];
  for (let i = 0; i < P.length; i++) {
    const [x, y, z] = P[i];
    const xr = x * ca - z * sa, zr = x * sa + z * ca;          // rotate about vertical axis
    const depth = 1 / (1.8 + zr);                                  // perspective
    pts.push([cx + xr * s * depth * 1.6, cy + y * s * depth * 1.6, depth, i]);
  }
  pts.sort((a, b) => a[2] - b[2]);
  for (const [px, py, d, i] of pts) {
    const g = glow[i];
    const r = (2.0 + g * 6) * d * 2.2 * devicePixelRatio;
    ctx.globalAlpha = 0.35 + 0.65 * d;
    if (g > 0.05) {                                                // spike halo
      const grad = ctx.createRadialGradient(px, py, 0, px, py, r * 3);
      grad.addColorStop(0, color[i]); grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad; ctx.globalAlpha = g * 0.9;
      ctx.beginPath(); ctx.arc(px, py, r * 3, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
    } else ctx.fillStyle = color[i];
    ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
    glow[i] *= 0.93;
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

const es = new EventSource('/events');
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === 'init') {
    cfg = m; P = m.positions; glow = new Array(m.n).fill(0); color = new Array(m.n).fill('#4a5670');
    Object.values(m.sensory).forEach((idx, gi) => idx.forEach(i => color[i] = BRIEF_COLORS[gi % 4]));
    Object.values(m.motor).forEach(idx => idx.forEach(i => color[i] = '#ffffff'));
    $('caption').innerHTML = m.mode === 'real'
      ? `<b>MaleCNS v1.0</b> · real <i>Drosophila</i> connectome · ${m.n} neurons at their real soma positions (LPLC2 + LC4 looming detectors → giant fiber) · synapses fixed, readout trained by reward`
      : `synthetic stand-in network · ${m.n} neurons · synapses fixed, readout trained by reward`;
    bars($('trig'), m.triggers, null, -1); bars($('act'), m.actions, null, -1);
  } else if (m.type === 'brief') {
    $('briefText').textContent = m.text;
    $('brief').style.borderColor = BRIEF_COLORS[m.index];
    $('nodeT').className = 'node'; $('nodeA').className = 'node';
    $('nodeT').innerHTML = '…<small>trigger</small>'; $('nodeA').innerHTML = '…<small>action</small>';
    $('n8n').className = ''; $('n8n').textContent = 'fly is thinking…'; $('editor').textContent = '';
    bars($('trig'), cfg.triggers, null, -1); bars($('act'), cfg.actions, null, -1);
  } else if (m.type === 'spikes') {
    for (const i of m.idx) glow[i] = 1;
  } else if (m.type === 'votes') {
    bars($('trig'), cfg.triggers, m.trigger, -1); bars($('act'), cfg.actions, m.action, -1);
  } else if (m.type === 'puppet') {
    $('editor').textContent = '🪰 ' + m.text;
  } else if (m.type === 'choice') {
    const ti = cfg.triggers.indexOf(m.trigger), ai = cfg.actions.indexOf(m.action);
    bars($('trig'), cfg.triggers, null, ti); bars($('act'), cfg.actions, null, ai);
    document.querySelectorAll('#trig .win .fill, #act .win .fill').forEach(f => f.style.width = '100%');
    $('nodeT').innerHTML = `${m.trigger}<small>n8n-nodes-base.${m.trigger}</small>`; $('nodeT').className = 'node on';
    setTimeout(() => { $('nodeA').innerHTML = `${m.action}<small>n8n-nodes-base.${m.action}</small>`; $('nodeA').className = 'node on'; }, 350);
    total++; if (m.correct) correct++;
    $('score').innerHTML = `designs matching the brief: <b>${correct}/${total}</b>`;
  } else if (m.type === 'n8n') {
    const el = $('n8n');
    if (m.status === 'executed') { el.className = 'ok'; el.textContent = `✓ executed in n8n  HTTP ${m.http}  POST ${m.url}`; }
    else if (m.status === 'designed') { el.className = ''; el.textContent = `✓ workflow JSON exported (${m.detail})`; }
    else { el.className = 'bad'; el.textContent = `✗ ${m.status} HTTP ${m.http}: ${m.detail}`; }
  }
};
</script>
</body>
</html>
